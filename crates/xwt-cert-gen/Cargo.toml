[package]
name = "xwt-cert-gen"
version = "0.2.1"
edition = "2021"
resolver = "2"
license = "MIT"
description = """
Certificate generation factilities, provided by and for xwt.
Useful for generating certificate. Also usable without xwt.
"""
repository = "https://github.com/MOZGIII/xwt"

[package.metadata.cargo-shear]
ignored = ["sha2", "p256", "spki", "rand", "getrandom"]

[dependencies]
der = { version = "0.8", default-features = false, features = ["alloc"] }
getrandom = { version = "0.4", features = ["wasm_js"] }
sha2 = { version = "0.11", default-features = false, features = ["oid"] }
signature = { version = "3", default-features = false, features = ["alloc"] }
spki = { version = "0.8", default-features = false, features = ["alloc", "fingerprint"] }
thiserror = "2"
x509-cert = { version = "0.3", default-features = false, features = ["pem", "builder", "std"] }

[dev-dependencies]
p256 = { version = "0.14", features = ["ecdsa"] }
rand = { version = "0.10" }
