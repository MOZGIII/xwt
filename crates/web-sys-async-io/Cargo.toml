[package]
name = "web-sys-async-io"
version = "0.5.0"
edition = "2021"
resolver = "2"
license = "MIT"
description = """
An async-IO implementation read/write stream in the browser, using the web-sys
types.
"""
repository = "https://github.com/MOZGIII/xwt"

[package.metadata.docs.rs]
default-target = "wasm32-unknown-unknown"

[target.'cfg(target_family = "wasm")'.dependencies]
js-sys = { workspace = true }
tokio = { workspace = true, default-features = false, features = [] }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
web-sys = { workspace = true, features = ["ReadableStreamDefaultReader", "WritableStreamDefaultWriter"] }
