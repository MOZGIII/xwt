[package]
name = "web-wt-sys"
version = "0.3.1"
edition = "2021"
resolver = "2"
license = "MIT"
description = """
Hand-crafted low-level Rust bindndings to WebTransport Web API for WebAssembly.
"""
repository = "https://github.com/MOZGIII/xwt"

[package.metadata.docs.rs]
default-target = "wasm32-unknown-unknown"

[package.metadata.cargo-shear]
ignored = ["wasm-bindgen-futures"]

[target.'cfg(target_family = "wasm")'.dependencies]
js-sys = "0.3.104"
pastey = "0.2"
wasm-bindgen = { version = "0.2.127" }
wasm-bindgen-futures = { version = "0.4.77" }
web-sys = { version = "0.3.104", features = [
  "ReadableStream",
  "ReadableStreamType",
  "WritableStream",
  "WritableStreamDefaultWriter",
  "DomException",
  "Headers",
  "ReadableStreamReadResult",
] }

[target.'cfg(target_family = "wasm")'.dev-dependencies]
tracing-wasm = "0.2"
wasm-bindgen-test = "0.3.77"
web-sys = { version = "0.3.104", features = ["console"] }
