[licenses]
allow = [
  "0BSD",
  "Apache-2.0 WITH LLVM-exception",
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "MIT",
  "Unlicense",
  "Unicode-3.0",
  "BSL-1.0",
]

[[licenses.clarify]]
name = "ring"
version = "*"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[licenses.private]
ignore = true

[bans]
multiple-versions = "allow"

[[bans.deny]]
name = "rcgen"
reason = "we generate certificates manually"

[[bans.features]]
name = "wtransport"
deny = ["default", "self-signed"]
reason = "never force default features for wtransport"

[advisories]
unmaintained = "workspace"
